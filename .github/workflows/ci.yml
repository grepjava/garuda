# What every change is checked by.
#
# On a push or a pull request: the build, the unit tests, the handler code that
# must not compile, the connectors against real PostgreSQL and Redis, and the
# end-to-end suites that drive the release binary over HTTP/1.1. Those are the
# ones fast enough to run each time and specific enough to be worth waiting
# for.
#
# Nightly, and on demand: the protocol suites -- HTTP/2, HTTP/3, WebSocket,
# WebTransport, uploads -- which need a Python environment and a QUIC stack,
# and the fuzzer under AddressSanitizer. A failure there is a bug to fix, not
# a pull request to block, and the matrix is long enough that running it on
# every push would teach people to ignore it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:17 UTC, off the hour so it does not queue behind everyone else's.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: "6.3.3"

jobs:
  linux:
    name: linux · build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/swift-linux
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Build
        run: swift build -c release --product garuda

      - name: Unit tests and the fuzz corpus
        run: swift test

      - name: Handler code that must not compile
        run: |
          swift build
          bash scripts/compile-fail-test.sh

  macos:
    name: macos · build and unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Newest installed Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          swift --version

      - name: Homebrew packages
        run: brew install pkg-config openssl@3

      - name: Environment
        run: |
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build
        run: |
          swift build -c release --product garuda \
            -Xcc -I"$OPENSSL_PREFIX/include" \
            -Xlinker -L"$OPENSSL_PREFIX/lib"

      - name: Unit tests and the fuzz corpus
        run: |
          swift test \
            -Xcc -I"$OPENSSL_PREFIX/include" \
            -Xlinker -L"$OPENSSL_PREFIX/lib"

  # The connector tests are opt-in: without these environment variables they
  # skip themselves, which is how `swift test` stays runnable with nothing
  # installed. This job is what stops that from meaning "never run".
  connectors:
    name: linux · PostgreSQL, Redis and the example app
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: garuda
          POSTGRES_PASSWORD: garuda-secret
          POSTGRES_DB: garuda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U garuda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GARUDA_POSTGRES: 127.0.0.1:5432:garuda:garuda-secret:garuda
      GARUDA_REDIS: 127.0.0.1:6379:garuda-secret
      STARTER_DATABASE_URL: postgres://garuda:garuda-secret@127.0.0.1:5432/garuda?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/swift-linux
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      # Not a `services:` entry, because one cannot give the image a command,
      # and the suite checks what a wrong password and no password do -- which
      # needs a server that asks for one.
      - name: Redis, asking for a password
        run: |
          docker run -d --name redis -p 6379:6379 redis:7 \
            redis-server --requirepass garuda-secret
          for _ in $(seq 1 30); do
            if docker exec redis redis-cli -a garuda-secret ping 2>/dev/null | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo "redis did not come up"; docker logs redis; exit 1

      - name: Unit tests, with the connector suites switched on
        run: swift test

      - name: The example applications
        working-directory: Examples
        run: swift test

  # The release binary driven over a socket, which is the only way to check
  # what the parser and the connection do rather than what a test client does.
  end-to-end:
    name: linux · end-to-end suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/swift-linux
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Tools the suites drive the server with
        run: sudo apt-get install -y --no-install-recommends curl netcat-openbsd openssl

      - name: Build the servers
        run: swift build -c release

      - name: Router, static files, compression and caching
        run: |
          bash scripts/integration-test.sh
          bash scripts/static-test.sh
          bash scripts/compress-test.sh
          bash scripts/cache-test.sh

      - name: Limits, redirects and certificates
        run: |
          bash scripts/ratelimit-test.sh
          bash scripts/redirect-test.sh
          bash scripts/sni-test.sh

      - name: Request identity and the supervisor
        run: |
          bash scripts/request-id-test.sh
          bash scripts/trace-context-test.sh
          bash scripts/drain-test.sh
          bash scripts/reload-test.sh

  # HTTP/2, HTTP/3, WebSocket, WebTransport and uploads, against clients built
  # from h2 and aioquic. Nightly: they need a Python environment and a QUIC
  # stack, and they are slow enough that blocking a push on them would be a
  # good way to have them turned off.
  protocols:
    name: linux · protocol suites
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/swift-linux
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Python clients
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install h2 aioquic
          echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: Tools the suites drive the server with
        run: sudo apt-get install -y --no-install-recommends curl openssl

      - name: Build the servers
        run: swift build -c release

      - name: Features and HTTP/1.1 handlers
        run: |
          python3 scripts/feature-test.py
          python3 scripts/handler-test.py
          python3 scripts/router-streams-test.py

      - name: HTTP/2 and HTTP/3
        run: |
          python3 scripts/http2-test.py
          python3 scripts/http3-test.py

      - name: WebSocket, WebTransport, uploads and broadcast
        run: |
          python3 scripts/websocket-test.py
          python3 scripts/websocket-streams-test.py
          python3 scripts/webtransport-test.py
          python3 scripts/upload-test.py
          python3 scripts/broadcast-test.py

  fuzz:
    name: linux · fuzz under AddressSanitizer
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/swift-linux
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Build with AddressSanitizer
        run: swift build -c release --product pgfuzz -Xswiftc -sanitize=address

      - name: Fuzz the parsers
        run: .build/release/pgfuzz --seconds ${{ github.event_name == 'schedule' && '600' || '60' }}

      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pgfuzz-findings
          path: pgfuzz-*.bin
          if-no-files-found: ignore

  dependency:
    name: linux · versioned dependency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/swift-linux
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      # SwiftPM treats a git URL with a version requirement as a remote
      # dependency and refuses unsafe build flags in one, so this fails if a
      # target of Garuda's ever sets them again.
      - name: Build a package that depends on Garuda by version
        run: |
          git tag 999.0.0
          mkdir -p /tmp/consumer/Sources/consumer
          cat > /tmp/consumer/Package.swift <<EOF
          // swift-tools-version: 6.1
          import PackageDescription
          let package = Package(
              name: "consumer",
              platforms: [.macOS(.v15)],
              dependencies: [.package(url: "file://$GITHUB_WORKSPACE", exact: "999.0.0")],
              targets: [.executableTarget(name: "consumer",
                                          dependencies: [.product(name: "Garuda", package: "garuda")])]
          )
          EOF
          cat > /tmp/consumer/Sources/consumer/main.swift <<'EOF'
          import Garuda

          let app = Application()
          app.get("/") { _, response in
              response.send(status: 200)
          }
          if CommandLine.arguments.contains("--serve") {
              _ = app.run()
          }
          EOF
          cd /tmp/consumer && swift build -c release
