# Prebuilt wheels for the interpreters the project claims to support.
#
# Each wheel carries peregrine._native, the server as an extension module,
# with the Swift runtime vendored beside it. The module is compiled against one
# CPython ABI, and the tag (cp312-cp312-manylinux_2_35_x86_64, cp314-cp314t-...)
# is that pairing; pip will not install it anywhere else. The manylinux_2_N
# platform is this image's glibc -- PyPI rejects linux_*. Python itself is the
# installing interpreter; nothing of it is vendored.
#
# Started by hand, like CI. Building ten release modules is a bill, and
# publishing is a separate input so a dry run cannot reach PyPI.

name: Wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the wheels to PyPI
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: "6.1.2"
  PEREGRINE_REQUIRE_RELOCATE: "1"

jobs:
  # Built on Ubuntu 22.04, so the tag is manylinux_2_35: that covers the
  # Debian bookworm the python:*-slim images are based on (glibc 2.36), Ubuntu
  # 22.04 and later, and anything newer. The libssl.so.3 the server links is on
  # all of them. 24.04 would have made it 2_39, which none of those meet.
  linux:
    name: linux ${{ matrix.arch }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            swift_platform: ubuntu22.04
            swift_slug: ubuntu2204
          - arch: aarch64
            runner: ubuntu-22.04-arm
            swift_platform: ubuntu22.04-aarch64
            swift_slug: ubuntu2204-aarch64
    env:
      SWIFT_PLATFORM: ${{ matrix.swift_platform }}
      SWIFT_SLUG: ${{ matrix.swift_slug }}
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils gcc libc6-dev libcurl4 libedit2 libncurses6 \
            libsqlite3-0 libssl-dev libstdc++-11-dev libxml2 pkg-config \
            tzdata zlib1g-dev patchelf curl

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache the Swift toolchain
        id: swift-cache
        uses: actions/cache@v4
        with:
          path: /opt/swift
          key: swift-${{ env.SWIFT_VERSION }}-${{ env.SWIFT_PLATFORM }}

      - name: Swift toolchain
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          dir="swift-${SWIFT_VERSION}-RELEASE-${SWIFT_PLATFORM}"
          url="https://download.swift.org/swift-${SWIFT_VERSION}-release/${SWIFT_SLUG}"
          url="${url}/swift-${SWIFT_VERSION}-RELEASE/${dir}.tar.gz"
          curl -fsSL "$url" -o /tmp/swift.tar.gz
          tar -xzf /tmp/swift.tar.gz -C /tmp
          sudo cp -r "/tmp/${dir}/usr" /opt/swift

      - name: Environment
        run: |
          echo "/opt/swift/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=${pythonLocation}/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${pythonLocation}/lib" >> "$GITHUB_ENV"

      - name: Which interpreter the module is built for
        run: |
          swift --version
          python --version
          pkg-config --modversion python3

      # setup.py imports the module in a clean interpreter before packaging,
      # and on 3.14t checks that the import leaves the GIL off.
      - name: Build the wheel
        run: |
          python -m pip install --quiet --disable-pip-version-check build
          python -m build --wheel

      - name: The wheel starts without the toolchain on the loader path
        run: |
          wheel=$(ls dist/peregrine_server-*.whl)
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet --disable-pip-version-check "$wheel"
          # The module has to find the Swift runtime inside the wheel. The
          # toolchain's LD_LIBRARY_PATH is the thing a real user will not have.
          cd /tmp
          env -u LD_LIBRARY_PATH /tmp/smoke/bin/python -c "import peregrine._native as n; print(n.__file__)"
          env -u LD_LIBRARY_PATH /tmp/smoke/bin/peregrine --version

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.arch }}-${{ matrix.python }}
          path: dist/peregrine_server-*.whl
          if-no-files-found: error

  # The build machine is the one place a wheel is guaranteed to work. This
  # installs each GIL wheel into the stock python:*-slim-bookworm image -- the
  # oldest glibc the tag claims to cover, and what a Dockerfile starts FROM --
  # with nothing but pip, and serves a request from it.
  slim:
    name: slim ${{ matrix.arch }} · python ${{ matrix.python }}
    needs: linux
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-${{ matrix.arch }}-${{ matrix.python }}
          path: wheels

      - name: Install and serve in python:${{ matrix.python }}-slim-bookworm
        run: |
          cat > app.py <<'EOF'
          async def app(scope, receive, send):
              if scope["type"] != "http":
                  return
              await send({"type": "http.response.start", "status": 200,
                          "headers": [(b"content-type", b"text/plain")]})
              await send({"type": "http.response.body", "body": scope["path"].encode()})
          EOF
          cat > check.sh <<'EOF'
          set -eu
          ldd --version | head -1
          pip install --quiet --disable-pip-version-check --no-index \
              --find-links /wheels peregrine-server
          peregrine --version
          cd /work
          peregrine --port 8000 app:app &
          for _ in $(seq 50); do
              python -c "import socket; socket.create_connection(('127.0.0.1', 8000))" 2>/dev/null && break
              sleep 0.2
          done
          body=$(python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8000/slim').read().decode())")
          echo "response: $body"
          [ "$body" = /slim ]
          EOF
          docker run --rm -v "$PWD/wheels:/wheels:ro" -v "$PWD:/work:ro" \
            "python:${{ matrix.python }}-slim-bookworm" sh /work/check.sh

  # Wheels only. The sdist goes up with them via scripts/publish-pypi.sh;
  # that is the path DEPLOY.md describes. This job is a shortcut.
  publish:
    name: publish
    if: ${{ inputs.publish }}
    needs: [linux, slim]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: What will be uploaded
        run: ls -l dist/*.whl

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check twine
          python3 -m twine upload --non-interactive dist/*.whl
