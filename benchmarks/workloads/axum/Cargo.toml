[package]
name = "workloads"
version = "0.0.0"
edition = "2021"
publish = false

# The profile benchmarks/axum uses, which is the-benchmarker's.
[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1

[dependencies]
# http2: prior-knowledge HTTP/2 on the plain port, as Garuda speaks it.
axum = { version = "0.8", features = ["http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
futures-util = "0.3"
bytes = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
# HTTPS when TLS_CERT and TLS_KEY are set: rustls, with ALPN offering h2 and
# http/1.1, as axum's own examples serve it.
axum-server = { version = "0.7", features = ["tls-rustls"] }
