[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peregrine-server"
version = "0.1.0"
description = "A Python ASGI/WSGI server written in Swift"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["asgi", "wsgi", "server", "http", "websockets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Server",
]

[project.optional-dependencies]
# uvloop is used automatically when it is importable, and is worth having.
uvloop = ["uvloop>=0.19"]

[project.scripts]
peregrine = "peregrine.__main__:main"

[project.urls]
Source = "https://github.com/example/peregrine"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["peregrine"]
include-package-data = true

[tool.setuptools.package-data]
peregrine = ["_bin/*"]
