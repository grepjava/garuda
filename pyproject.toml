[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peregrine-server"
version = "1.0.0"
description = "A Python ASGI/WSGI server written in Swift"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["asgi", "wsgi", "server", "http", "http2", "http3", "quic", "websockets", "webtransport"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Server",
]

[project.optional-dependencies]
# uvloop is used automatically when it is importable, and is worth having.
uvloop = ["uvloop>=0.19"]

[project.scripts]
peregrine = "peregrine.__main__:main"

[project.urls]
Source = "https://github.com/grepjava/peregrine"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["peregrine", "peregrine.contrib"]
include-package-data = true

[tool.setuptools.package-data]
peregrine = ["_bin/*", "_bin/lib/*"]

# The installable package lives under python/, not the repo root. examples/
# import FastAPI and Django, which are not dependencies of the server — they
# are samples — so missing those imports is not a defect.
[tool.pyright]
extraPaths = ["python"]
pythonVersion = "3.12"

[[tool.pyright.executionEnvironments]]
root = "examples"
extraPaths = ["python"]
reportMissingImports = false
