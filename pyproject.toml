[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peregrine-server"
version = "1.1.4"
description = "A fast ASGI and WSGI server for FastAPI, Flask and Django, written in Swift, with HTTP/2, HTTP/3 and WebTransport"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "asgi", "wsgi", "server", "http", "http2", "http3", "quic", "websockets",
    "webtransport", "fastapi", "flask", "django", "starlette", "uvicorn",
    "gunicorn", "granian", "swift", "free-threading",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Server",
]

[project.optional-dependencies]
# uvloop is used automatically when it is importable, and is worth having.
uvloop = ["uvloop>=0.19"]

[project.scripts]
peregrine = "peregrine.__main__:main"

[project.urls]
Homepage = "https://github.com/grepjava/peregrine"
Source = "https://github.com/grepjava/peregrine"
Documentation = "https://github.com/grepjava/peregrine/blob/main/CONFIG.md"
Benchmarks = "https://github.com/grepjava/peregrine/blob/main/BENCHMARKS.md"
Changelog = "https://github.com/grepjava/peregrine/blob/main/RELEASE.md"
Issues = "https://github.com/grepjava/peregrine/issues"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["peregrine", "peregrine.contrib"]
include-package-data = true

[tool.setuptools.package-data]
peregrine = ["_bin/*", "_bin/lib/*"]

# The installable package lives under python/, not the repo root. examples/
# import FastAPI and Django, which are not dependencies of the server — they
# are samples — so missing those imports is not a defect.
[tool.pyright]
extraPaths = ["python"]
pythonVersion = "3.12"

[[tool.pyright.executionEnvironments]]
root = "examples"
extraPaths = ["python"]
reportMissingImports = false
